<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>穎利科技｜作業中心</title>
<meta name="description" content="穎利科技作業中心">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="穎利ERP">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#E30613; --red-dark:#8f0009; --bg:#0a0a0c; --panel:#141418;
    --white:#ffffff; --gray:#6a6a72; --line:rgba(255,255,255,.08);
    --en:'Chakra Petch',sans-serif; --tc:'Noto Sans TC',sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--white); font-family:var(--tc);
    overflow:hidden; display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  /* 背景網格 + 斜切紅光帶（閃）*/
  .grid{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(ellipse 90% 80% at 50% 45%,#000 30%,transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse 90% 80% at 50% 45%,#000 30%,transparent 75%);
  }
  /* 步步高升：一串粉紅肉球由左下往右上依序印上去 */
  .trail{
    position:fixed; z-index:1; pointer-events:none;
    left:50%; top:50%;
    transform:translate(-50%,-50%) rotate(-18deg);
    width:160vmax; height:60px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .trail .step{
    width:26px; height:26px; line-height:0;
    opacity:0;
    filter:drop-shadow(0 0 8px rgba(255,179,198,.5));
    animation:stepUp 4s ease-in-out infinite;
  }
  .trail .step svg{ width:100%; height:100%; display:block; fill:#ffb3c6; }  /* 奶油粉，改這裡就換色 */
  /* 每顆略略交錯上下，像真的踩出來的腳印 */
  .trail .step:nth-child(odd){  transform:translateY(-7px) rotate(-12deg); }
  .trail .step:nth-child(even){ transform:translateY(7px)  rotate(12deg); }
  @keyframes stepUp{
    0%      { opacity:0; }
    8%,55%  { opacity:.9; }   /* 亮起、停留 */
    75%,100%{ opacity:0; }    /* 淡出，準備下一輪 */
  }
  @media (prefers-reduced-motion:reduce){ .trail .step{ opacity:.6 !important; } }
  /* 飄浮肉球 */
  .paw{
    position:fixed; z-index:1; pointer-events:none; opacity:0;
    animation:floatUp linear infinite;
  }
  .paw svg{ width:100%; height:100%; display:block; fill:#ffb3c6; }  /* 奶油粉，跟腳印同色 */
  @keyframes floatUp{
    0%{ transform:translateY(20px) rotate(var(--rot)); opacity:0; }
    12%{ opacity:.5; }
    88%{ opacity:.5; }
    100%{ transform:translateY(-108vh) rotate(var(--rot)); opacity:0; }
  }
  /* 主體 */
  .stage{
    position:relative; z-index:10; text-align:center; padding:28px;
    max-width:600px; width:100%;
    display:flex; flex-direction:column; align-items:center;
  }
  .logo{
    height:60px; max-width:82vw; object-fit:contain; margin-bottom:18px;
    filter:drop-shadow(0 0 14px rgba(227,6,19,.5));
    opacity:0; animation:rise .6s .1s forwards, floaty 5s 1s ease-in-out infinite;
  }
  @media (max-width:480px){ .logo{ height:48px; } }
  .brand{
    font-family:var(--en); font-weight:600; font-size:12px;
    letter-spacing:7px; color:var(--gray); text-transform:uppercase;
    opacity:0; animation:rise .6s .2s forwards;
  }
  .brand b{ color:var(--red); }
  .title{
    position:relative; margin:12px 0 6px;
    font-weight:900; font-size:clamp(50px,13vw,82px);
    letter-spacing:10px; margin-right:-10px; line-height:1.1;
    opacity:0; animation:rise .6s .35s forwards;
    text-shadow:0 0 26px rgba(227,6,19,.35);
  }
  .title .paw-dot{ color:var(--red); font-size:.5em; vertical-align:middle;
    display:inline-block; animation:wag 2.5s ease-in-out infinite; }
  @keyframes wag{ 0%,100%{transform:rotate(-12deg)} 50%{transform:rotate(12deg)} }
  .sub{
    font-family:var(--en); font-weight:700; font-size:13px;
    letter-spacing:8px; color:var(--red); text-transform:uppercase;
    text-shadow:0 0 12px rgba(227,6,19,.6);
    opacity:0; animation:rise .6s .45s forwards;
  }
  .divider{
    width:200px; height:3px; margin:30px 0 22px;
    background:repeating-linear-gradient(-45deg,var(--red) 0 8px,transparent 8px 16px);
    opacity:0; animation:rise .6s .55s forwards;
  }
  .company{
    font-size:13px; letter-spacing:3px; color:var(--gray); margin-bottom:30px;
    opacity:0; animation:rise .6s .6s forwards;
  }
  /* 進入按鈕 */
  .enter{
    transform:skewX(-14deg);
    background:linear-gradient(135deg,var(--red),var(--red-dark));
    border:none; cursor:pointer; padding:0; position:relative;
    box-shadow:0 0 24px rgba(227,6,19,.45), 0 7px 0 rgba(0,0,0,.5);
    opacity:0; animation:rise .6s .75s forwards, glowPulse 3.5s 2s ease-in-out infinite;
    transition:transform .12s, box-shadow .12s;
  }
  .enter::before{ content:''; position:absolute; inset:3px;
    border:1px solid rgba(255,255,255,.35); pointer-events:none; }
  .enter:hover{ transform:skewX(-14deg) translateY(-2px);
    box-shadow:0 0 40px rgba(227,6,19,.8),0 9px 0 rgba(0,0,0,.5); }
  .enter:active{ transform:skewX(-14deg) translateY(2px);
    box-shadow:0 0 16px rgba(227,6,19,.5),0 3px 0 rgba(0,0,0,.5); }
  .enter .lab{ display:block; transform:skewX(14deg);
    padding:18px 58px; font-family:var(--tc); font-weight:900;
    font-size:21px; letter-spacing:8px; margin-right:-8px; color:#fff; }
  .enter .en{ display:block; transform:skewX(14deg);
    font-family:var(--en); font-weight:600; font-size:10px;
    letter-spacing:5px; color:rgba(255,255,255,.7);
    padding-bottom:11px; margin-top:-9px; }
  @keyframes glowPulse{ 0%,100%{box-shadow:0 0 24px rgba(227,6,19,.45),0 7px 0 rgba(0,0,0,.5)}
    50%{box-shadow:0 0 38px rgba(227,6,19,.7),0 7px 0 rgba(0,0,0,.5)} }
  .tapline{
    margin-top:20px; font-family:var(--en); font-size:10px; letter-spacing:4px;
    color:var(--gray); text-transform:uppercase;
    opacity:0; animation:rise .6s .9s forwards, blink 1.8s 1.5s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:.85} 50%{opacity:.3} }
  @keyframes rise{ from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)} }
  @keyframes floaty{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; opacity:1 !important; } }
  /* ★ 2026/09/04　記憶指紋（只有在「沒有票、待會要重登」時才出現） */
  #wzMark{
    margin-top:16px; max-width:320px; line-height:1.9;
    font-size:11px; color:#54545c; letter-spacing:1px; display:none;
  }
  #wzMark.show{ display:block; }
  #wzMark code{
    display:block; margin-top:5px; font-family:var(--en);
    font-size:12px; letter-spacing:2px; color:#8a8a92;
  }
  /* ===== 推播詢問卡 ===== */
  #pushAsk{
    position:fixed; inset:0; z-index:9999; display:none;
    background:rgba(5,5,7,.92); backdrop-filter:blur(6px);
    align-items:center; justify-content:center; padding:24px;
  }
  #pushAsk.show{ display:flex; }
  #pushAsk .box{
    background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--red);
    max-width:380px; width:100%; padding:26px 24px; text-align:center;
    animation:rise .35s ease both;
  }
  #pushAsk .ic{ font-size:38px; line-height:1; margin-bottom:14px; }
  #pushAsk h3{ font-size:19px; font-weight:900; letter-spacing:2px; margin-bottom:10px; }
  #pushAsk p{ font-size:13px; color:#9a9aa2; line-height:1.8; margin-bottom:22px; }
  #pushAsk .yes{
    width:100%; border:0; cursor:pointer; padding:15px; font-family:var(--tc);
    font-weight:900; font-size:16px; letter-spacing:3px; color:#fff;
    background:linear-gradient(135deg,var(--red),var(--red-dark));
    box-shadow:0 0 20px rgba(227,6,19,.4);
  }
  #pushAsk .no{
    width:100%; border:0; cursor:pointer; padding:13px; margin-top:10px;
    background:transparent; color:#6a6a72; font-family:var(--tc);
    font-size:13px; letter-spacing:2px;
  }
  #pushAsk .cd{
    margin-top:14px; font-family:var(--en); font-size:10px;
    letter-spacing:3px; color:#44444c;
  }
</style>
</head>
<body>

<div class="grid"></div>
<div class="trail" id="trail"></div>
<!-- ===== 推播詢問卡（第一次進系統才出現）===== -->
<div id="pushAsk">
  <div class="box">
    <div class="ic">🔔</div>
    <h3>開啟通知？</h3>
    <p>待辦事項、簽核提醒、系統公告<br>會直接推到這台裝置，不用一直開系統看。</p>
    <button class="yes" id="pushYes">開啟通知</button>
    <button class="no"  id="pushNo">稍後再說</button>
    <div class="cd" id="pushCd"></div>
  </div>
</div>
<div class="stage">
  <img class="logo" src="logo.png" alt="穎利科技 WINZ" onerror="this.style.display='none'">
  <div class="brand">WINZ <b>//</b> PET OEM</div>
  <h1 class="title">作業中心<span class="paw-dot"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:.5em;height:.5em;vertical-align:middle;fill:#ffb3c6"><ellipse cx="50" cy="66" rx="24" ry="19"/><ellipse cx="24" cy="42" rx="9" ry="12"/><ellipse cx="42" cy="30" rx="9" ry="13"/><ellipse cx="60" cy="30" rx="9" ry="13"/><ellipse cx="77" cy="42" rx="9" ry="12"/></svg></span></h1>
  <div class="sub">Operations Hub</div>
  <div class="divider"></div>
  <div class="company">穎利科技股份有限公司</div>
  <button class="enter" id="btnEnter">
    <span class="lab">進入系統</span>
    <span class="en">// PRESS TO ENTER //</span>
  </button>
  <div class="tapline">Tap to launch</div>
  <!-- ★ 2026/09/04　記憶指紋：只有在「這台裝置已經忘記你」的時候才會出現 -->
  <div id="wzMark"></div>
</div>
<script>
 var TARGET_URL = 'https://script.google.com/a/macros/winz-tech.com/s/AKfycbzSn9xYdkf7bVZIaPe8XtrKMPdsdegPtV3kZZ72QJ44GJE9RHBal29SsE9K7ekREXUwWQ/exec';

  // ═══ 【2026/09/04】記憶工具 ═══
  //   ★ 為什麼要有這一段：iOS 會在沒有任何通知的情況下清掉網站的記憶，
  //     而我們一直沒有辦法知道「它清掉了哪一種」。
  //     這裡同時在 cookie 和 localStorage 各放一個時間戳，
  //     下次冷啟動時比對誰還活著 —— 讓裝置自己說出它做了什麼。
  var WZ_CK_MAXAGE = 400*24*60*60;
  function getCk(k){ try{ var m=document.cookie.match('(^|;)\\s*'+k+'\\s*=\\s*([^;]+)'); return m?decodeURIComponent(m.pop()):''; }catch(e){ return ''; } }
  function setCk(k,v){ try{ document.cookie = k+'='+encodeURIComponent(v)+'; max-age='+WZ_CK_MAXAGE+'; path=/; SameSite=Lax; Secure'; }catch(e){} }
  function delCk(k){ try{ document.cookie = k+'=; max-age=0; path=/; SameSite=Lax; Secure'; }catch(e){} }
  function lsGet(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

  // 環境指紋（跟 01-auth 的 _wzEnv 同一套寫法，兩邊代碼才能對照）
  function _wzEnv2(){
    var ua = navigator.userAgent, tp = navigator.maxTouchPoints || 0, o;
    if (/iPhone|iPad|iPod/.test(ua))   o = 'iOS';
    else if (/Macintosh/.test(ua))     o = (tp > 0 ? 'iOS-桌面模式' : 'Mac');   // ★ 真 Mac 的 tp 是 0
    else if (/Android/.test(ua))       o = 'Android';
    else                               o = 'Win';
    var sa = false;
    try { sa = window.matchMedia('(display-mode: standalone)').matches
               || window.navigator.standalone === true; } catch(e){}
    return o + (sa ? '·PWA' : '·瀏覽器') + '　' + screen.width + 'x' + screen.height + '　tp' + tp;
  }

  function _wzAge(t){
    var n = Number(t || 0);
    if (!(n > 0)) return '';
    var h = (Date.now() - n) / 3600000;
    if (!isFinite(h) || h < 0) return '';
    if (h < 1)  return Math.round(h*60) + 'm';
    if (h < 48) return h.toFixed(1) + 'h';
    return Math.round(h/24) + 'd';
  }

  // ★★ 「來過」記號：不管有沒有登入，只要開過這一頁就種。
  //    ── 為什麼要跟「票」分開量：
  //    票的記號要走完一次登入才會種，量一次就得登入一次，太貴而且容易分不清
  //    「記號被清掉」和「記號從來沒種過」。這一組只要開過首頁就有，
  //    下次冷啟動它還在不在，直接回答「這台裝置到底有沒有被清空」。
  //    ★ 先讀再寫，順序不能顛倒 —— 顛倒了就永遠量到自己剛寫的那一筆。
  var _WZ_SEEN = { c: getCk('WZ_SEEN_CK'), l: lsGet('WZ_SEEN_LS') };
  (function(){
    var v = _WZ_SEEN.c || _WZ_SEEN.l || String(Date.now());
    setCk('WZ_SEEN_CK', v); lsSet('WZ_SEEN_LS', v);       // 有就沿用，沒有才種新的
  })();

  // 只在「沒有票」時顯示 —— 那正好就是待會要重新登入的那一刻
  function _wzShowMark(){
    try {
      if (getCk('WZ_TOKEN_CK')) return;                  // 有票就什麼都不用講
      var atC = getCk('WZ_AT_CK'), atL = lsGet('WZ_AT_LS');
      var tAge = _wzAge(atC || atL);
      var sAge = _wzAge(_WZ_SEEN.c || _WZ_SEEN.l);
      var code = '票 C' + (atC ? '1' : '0') + 'L' + (atL ? '1' : '0')
               + (tAge ? ' ' + tAge : '')
               + ' · 來過 C' + (_WZ_SEEN.c ? '1' : '0') + 'L' + (_WZ_SEEN.l ? '1' : '0')
               + (sAge ? ' ' + sAge : '')
               + ' · ' + _wzEnv2();
      var el = document.getElementById('wzMark');
      if (!el) return;
      el.innerHTML = '如果最近常常要重新登入，<br>請把下面這行 <b style="color:#8a8a92">截圖</b> 傳給元家'
                   + '<code>' + code.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</code>';
      el.classList.add('show');
    } catch(e){}
  }

  // ═══ 第二刀:冷啟動讀 cookie → 後端驗證 → 無感進系統 ═══
  //   資安:cookie 只是鑰匙圈,放行永遠問後端 validate;token 被拔 → 當場清 cookie 踢登入
  (function(){
    var q = new URLSearchParams(location.search);
    if (q.get('logout') === '1') {                       // 登出回來:清 cookie 停在接待頁
      delCk('WZ_TOKEN_CK'); delCk('WZ_NAME_CK'); delCk('WZ_AT_CK'); lsDel('WZ_AT_LS');
      document.addEventListener('DOMContentLoaded', _wzShowMark);   // 登出後也看得到指紋
      return;
    }
    var tok = getCk('WZ_TOKEN_CK');
    if (!tok) { document.addEventListener('DOMContentLoaded', _wzShowMark); return; }   // 沒 cookie → 正常接待頁
    // ★ 有 cookie → 立刻收掉進入鈕,畫面切「歡迎回來」,防止手癢按下去跟無感進打架
    document.addEventListener('DOMContentLoaded', function(){
      try {
        var b = document.getElementById('btnEnter');
        if (b) { b.style.pointerEvents = 'none'; b.style.opacity = '.35'; }
        var lab = document.querySelector('.enter .lab');
        if (lab) lab.textContent = '登入中…';
        var tp = document.querySelector('.tapline');
        if (tp) tp.textContent = 'WELCOME BACK · AUTO LOGIN';
      } catch(e){}
    });
    fetch(TARGET_URL + '?page=validate&t=' + encodeURIComponent(tok))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.ok && d.rc) {
          // ★★ 2026/09/04　每次驗證成功就把票重寫一次 —— 續期。
          //    原本這張 cookie 只有在完整登入那一刻寫過一次，之後沒有任何人幫它延長。
          //    他們天天從這一頁進系統，這是白白浪費掉的續期機會。
          setCk('WZ_TOKEN_CK', tok);
          var _nm = getCk('WZ_NAME_CK'); if (_nm) setCk('WZ_NAME_CK', _nm);
          var _at = getCk('WZ_AT_CK') || lsGet('WZ_AT_LS') || String(Date.now());
          setCk('WZ_AT_CK', _at); lsSet('WZ_AT_LS', _at);   // 種票時間不動，只延長期限
          var _go = TARGET_URL + '?rc=' + encodeURIComponent(d.rc);
          _wzPushGate(tok, _go);          // ★ 推播詢問閘門：不用問就直接放行
        } else {
          delCk('WZ_TOKEN_CK'); delCk('WZ_NAME_CK');     // token 無效(離職/被踢) → 清 cookie 留在接待頁
          _wzRestoreBtn();                                // 按鈕還回來,走手動登入
          _wzShowMark();
        }
      })
      .catch(function(){ _wzRestoreBtn(); /* 網路失敗 → 留在接待頁手動進,不擋人 */ });
    function _wzRestoreBtn(){
      try {
        var b = document.getElementById('btnEnter');
        if (b) { b.style.pointerEvents = ''; b.style.opacity = ''; }
        var lab = document.querySelector('.enter .lab');
        if (lab) lab.textContent = '進入系統';
        var tp = document.querySelector('.tapline');
        if (tp) tp.textContent = 'Tap to launch';
      } catch(e){}
    }
  })();

 // ═══ 推播詢問閘門 ═══
  //   只在「第一次」問，之後永遠無感通過
  //   ★ 稍後記憶用 cookie 不用 localStorage（iOS PWA 冷啟動會清 localStorage）
  function _wzB64(b){
    var p = '='.repeat((4 - b.length % 4) % 4);
    var s = atob((b + p).replace(/-/g,'+').replace(/_/g,'/'));
    var a = new Uint8Array(s.length);
    for (var i=0;i<s.length;i++) a[i] = s.charCodeAt(i);
    return a;
  }
  function _wzDev(){
    var u = navigator.userAgent;
    return /iPhone|iPad|iPod/.test(u) ? 'iPhone/iPad'
         : /Android/.test(u) ? 'Android'
         : /Macintosh/.test(u) ? 'Mac' : 'Windows/其他';
  }
  function _wzPushGate(token, goUrl){
    var jumped = false;
    function go(){ if (jumped) return; jumped = true; location.replace(goUrl); }
    // rc 只有 60 秒，最多擋 40 秒就強制放行
    var guard = setTimeout(go, 40000);
    (async function(){
      try{
        // ---- 不該問的情形，直接放行 ----
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) return go();
        if (typeof Notification === 'undefined') return go();
        if (Notification.permission === 'denied') return go();      // 被封鎖，問也沒用
        var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
        var standalone = window.matchMedia('(display-mode: standalone)').matches
                         || window.navigator.standalone === true;
        if (isIOS && !standalone) return go();                      // Safari 分頁沒 PushManager
        if (getCk('WZ_PUSH_LATER')) return go();                    // 按過稍後，14 天內不吵
        // ★ 用 ready 回傳的 registration（保證 active，剛註冊時才讀得到訂閱）
        var reg = await navigator.serviceWorker.getRegistration();
        if (!reg) { try { await navigator.serviceWorker.register('sw.js'); } catch(e){} }
        reg = await navigator.serviceWorker.ready;
        // ★ 已訂閱 → 每次都把訂閱重送後端一次（自我修復）
        //   舊版只檢查瀏覽器端，若後端寫入曾失敗就永遠補不回來，人會完全收不到通知
        var _cur = await reg.pushManager.getSubscription();
        if (_cur) {
          fetch(TARGET_URL, {
            method:'POST',
            headers:{'Content-Type':'text/plain;charset=utf-8'},
            body: JSON.stringify({ act:'pushSub', token:token,
                                   sub: JSON.stringify(_cur.toJSON()), device: _wzDev() })
          }).then(function(r){ return r.text(); })
            .then(function(t){ console.log('[push] 訂閱同步:', t.slice(0,80)); })
            .catch(function(){});
          return go();                                              // 不 await，不擋登入速度
        }
        // ---- 拿公鑰 ----
        var pub = '';
        try{
          var j = await (await fetch(TARGET_URL + '?page=pushkey')).json();
          pub = j.key || '';
        }catch(e){}
        if (!pub) return go();
        // ★★ 已授權過但訂閱不見了（iOS 會驅逐 PWA 資料）→ 靜默重訂，絕不打擾
        //    權限已是 granted，subscribe 不需要使用者手勢
        if (Notification.permission === 'granted'){
          try{
            var s2 = await reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: _wzB64(pub)
            });
            console.log('[push] 訂閱建立:', s2.endpoint.slice(0,50));
            var r2 = await fetch(TARGET_URL, {
              method:'POST',
              headers:{'Content-Type':'text/plain;charset=utf-8'},
              body: JSON.stringify({ act:'pushSub', token:token,
                                     sub: JSON.stringify(s2.toJSON()), device: _wzDev() })
            });
            var j2 = null;
            try { j2 = await r2.json(); } catch(e2){}
            console.log('[push] 後端回應:', JSON.stringify(j2));
            if (!j2 || j2.ok === false) console.warn('[push] 寫入失敗,後端未收到訂閱');
          }catch(e){ console.warn('[push] 靜默重訂失敗:', e && e.message); }
          return go();                                              // 不論成敗都放行，不彈卡
        }
        // ★ 保險絲：問過一次就種記號，90 天內不再問
        //   即使上面所有偵測都失效，最糟也只會被問一次
        if (getCk('WZ_PUSH_ASKED')) return go();
        document.cookie = 'WZ_PUSH_ASKED=1; max-age=' + (90*86400) + '; path=/; SameSite=Lax';
        // ---- 顯示卡片 ----
        clearTimeout(guard);
        var box = document.getElementById('pushAsk');
        box.classList.add('show');
        var left = 35, cd = document.getElementById('pushCd');
        cd.textContent = left + ' 秒後自動進入系統';
        var tick = setInterval(function(){
          left--;
          cd.textContent = left + ' 秒後自動進入系統';
          if (left <= 0){ clearInterval(tick); go(); }
        }, 1000);
        function done(){ clearInterval(tick); box.classList.remove('show'); go(); }
        // 稍後再說 → 種 14 天 cookie
        document.getElementById('pushNo').onclick = function(){
          document.cookie = 'WZ_PUSH_LATER=1; max-age=' + (14*86400) + '; path=/; SameSite=Lax';
          done();
        };
        // 開啟通知（鐵律1：必須在真手點事件裡呼叫 requestPermission）
        document.getElementById('pushYes').onclick = async function(){
          var btn = this;
          btn.disabled = true; btn.textContent = '設定中…';
          clearInterval(tick); cd.textContent = '';
          try{
            var perm = await Notification.requestPermission();
            if (perm === 'granted'){
              var u8 = function(b){
                var p = '='.repeat((4 - b.length % 4) % 4);
                var s = atob((b + p).replace(/-/g,'+').replace(/_/g,'/'));
                var a = new Uint8Array(s.length);
                for (var i=0;i<s.length;i++) a[i] = s.charCodeAt(i);
                return a;
              };
              var ua = navigator.userAgent, dev = /iPhone|iPad|iPod/.test(ua) ? 'iPhone/iPad'
                     : /Android/.test(ua) ? 'Android'
                     : /Macintosh/.test(ua) ? 'Mac' : 'Windows/其他';
              var sub = await reg.pushManager.subscribe({
                userVisibleOnly: true,                       // 鐵律2：iOS 強制
                applicationServerKey: u8(pub)
              });
              var r3 = await fetch(TARGET_URL, {             // text/plain 避開 CORS preflight
                method:'POST',
                headers:{'Content-Type':'text/plain;charset=utf-8'},
                body: JSON.stringify({ act:'pushSub', token:token,
                                       sub: JSON.stringify(sub.toJSON()), device: dev })
              });
              var j3 = null;
              try { j3 = await r3.json(); } catch(e3){}
              console.log('[push] 後端回應:', JSON.stringify(j3));
              if (j3 && j3.ok !== false) {
                reg.showNotification('WINZ 通知已開啟', {
                  body:'待辦與系統提醒會推到這裡', icon:'icon-192.png'
                });
              } else {
                reg.showNotification('通知設定未完成', {
                  body:'請重新登入一次,或回報給管理者', icon:'icon-192.png'
                });
              }
            } else {
              // 拒絕了就不用再問，permission 本身會擋住
            }
          }catch(e){}
          done();
        };
      }catch(e){ go(); }
    })();
  }
 // 步步高升：生成一串奶油粉肉球(SVG)，逐顆延遲亮起（左下→右上）
  (function(){
    var trail = document.getElementById('trail');
    if (!trail) return;
    // 肉球 SVG：一個大掌墊 + 四個腳趾
    var PAW = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
      '<ellipse cx="50" cy="66" rx="24" ry="19"/>' +
      '<ellipse cx="24" cy="42" rx="9" ry="12"/>' +
      '<ellipse cx="42" cy="30" rx="9" ry="13"/>' +
      '<ellipse cx="60" cy="30" rx="9" ry="13"/>' +
      '<ellipse cx="77" cy="42" rx="9" ry="12"/>' +
      '</svg>';
    var N = 12;                       // 幾顆腳印
    for (var i = 0; i < N; i++){
      var p = document.createElement('span');
      p.className = 'step';
      p.innerHTML = PAW;
      p.style.animationDelay = (i * 0.28) + 's';   // 依序亮起，做出一步步印的感覺
      trail.appendChild(p);
    }
  })();
  // 飄浮肉球生成（奶油粉 SVG，跟腳印同色）
  (function(){
    var PAW = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
      '<ellipse cx="50" cy="66" rx="24" ry="19"/>' +
      '<ellipse cx="24" cy="42" rx="9" ry="12"/>' +
      '<ellipse cx="42" cy="30" rx="9" ry="13"/>' +
      '<ellipse cx="60" cy="30" rx="9" ry="13"/>' +
      '<ellipse cx="77" cy="42" rx="9" ry="12"/>' +
      '</svg>';
    for (var i = 0; i < 7; i++){
      var s = document.createElement('div');
      s.className = 'paw';
      s.innerHTML = PAW;
      var size = 14 + Math.random()*20;
      s.style.left = (Math.random()*100) + 'vw';
      s.style.width  = size + 'px';
      s.style.height = size + 'px';
      s.style.setProperty('--rot', (Math.random()*40-20) + 'deg');
      s.style.animationDuration = (13 + Math.random()*10) + 's';
      s.style.animationDelay = (Math.random()*8) + 's';
      document.body.appendChild(s);
    }
  })();
  var launched = false;
  function launch(){
    if (launched) return; launched = true;
    document.getElementById('btnEnter').style.opacity = '.6';
    var tok = getCk('WZ_TOKEN_CK');
    if (tok && Notification.permission === 'granted') {
      _wzPushGate(tok, TARGET_URL);      // 只有已授權才走閘門 → 必定靜默重訂,不可能彈卡
    } else {
      window.location.href = TARGET_URL;
    }
  }
  document.getElementById('btnEnter').addEventListener('click', launch);
  document.addEventListener('touchend', function(e){
    if (e.target.closest('.enter')) return; // 按鈕自己處理
  }, { passive:true });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js')
  .then(function(reg){ reg.update(); console.log('SW 已註冊'); })
  .catch(function(e){ console.log('SW 註冊失敗', e); });
    });
  }
</script>
