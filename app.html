<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>穎利科技｜作業中心</title>
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="穎利ERP">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0a0a0c}
  /* 瀏海／底部安全區：外殼自己吃掉，內層 GAS 讀不到 env() */
  #pad{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);background:#0a0a0c}
  #frame{width:100%;height:100%;border:0;display:block;background:#0a0a0c}
  #veil{position:fixed;inset:0;z-index:10;background:#0a0a0c;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    font-family:-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;
    transition:opacity .4s ease;padding:24px;text-align:center}
  #veil.hide{opacity:0;pointer-events:none}
  .spin{width:42px;height:42px;border:3px solid #2a2a30;border-top-color:#E30613;
    border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .t{color:#fff;font-size:16px;font-weight:bold;letter-spacing:2px}
  .s{color:#8a8a92;font-size:13px;line-height:1.8}
  .btn{display:none;margin-top:6px;padding:14px 38px;border:0;cursor:pointer;
    text-decoration:none;border-radius:8px;font-family:inherit;
    background:linear-gradient(135deg,#E30613,#8f0009);color:#fff;
    font-size:16px;font-weight:bold;letter-spacing:3px;
    box-shadow:0 0 20px rgba(227,6,19,.4)}
  .btn.on{display:inline-block}
</style>
</head>
<body>
<div id="pad"><iframe id="frame" title="穎利科技作業中心"
        referrerpolicy="no-referrer-when-downgrade" allow="clipboard-write"></iframe></div>

<div id="veil">
  <div class="spin" id="spin"></div>
  <div class="t" id="msg">連線中…</div>
  <div class="s" id="sub"></div>
  <a class="btn" id="go" href="index.html">前往登入</a>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   portal/app.html　外殼（試作）　2026/09/06
   ── 骨架抄自元家自己的家計簿 vladjia.github.io/Jia-Cai/index.html
   目的兩個：
     ① 頂層永遠停在 winz-tech.github.io → iOS 不會再開「App 內臨時瀏覽器」
     ② script.google.com 那條白色橫幅（「這個應用程式是由 Google Apps Script
        的使用者建立」）只在頂層才長得出來，包進 iframe 就沒了

   ⚠ 這一版是「試看看」用的，沒有任何人的捷徑會走到它。
     壞掉不影響任何人 —— 可以放心開。

   ⚠ 內層 GAS 必須有 .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL)
     才嵌得進來，否則會是一片空白。

   ⚠ 尚未處理：內層頁面之間的切換。
     現在 34 支系統互跳用的是頂層跳轉（window.top.location），
     那一跳會把這個殼整個掀掉 → 橫幅回來、scope 也出去。
     正解是內層改成 postMessage 通知外殼換頁（家計簿的 famnav 那一套），
     下面已經先把接收端寫好了，等內層改。
   ════════════════════════════════════════════════════════════ */
(function(){
  // ── 目前只掛打卡專案（試作階段）。之後要多支就往這裡加。
  var APPS = {
    punch: 'https://script.google.com/a/macros/winz-tech.com/s/AKfycbxUDyY2BWgoYF4fbEOCBMnw-bmz-1KxogCpvtezgZboiuC9S04oHNnhkVPXb3Kg6Gp3/exec'
  };
  var EXEC = APPS.punch;

  var frame = document.getElementById('frame');
  var veil  = document.getElementById('veil');
  var spin  = document.getElementById('spin');
  var msg   = document.getElementById('msg');
  var sub   = document.getElementById('sub');
  var go    = document.getElementById('go');

  function getCk(k){
    try { var m = document.cookie.match('(^|;)\\s*' + k + '\\s*=\\s*([^;]+)');
          return m ? decodeURIComponent(m.pop()) : ''; }
    catch(e){ return ''; }
  }
  function fail(title, detail, btnText, btnHref){
    spin.style.display = 'none';
    msg.textContent = title;
    sub.innerHTML = detail || '';
    if (btnText){ go.textContent = btnText; go.setAttribute('href', btnHref || 'index.html'); go.classList.add('on'); }
    veil.classList.remove('hide');
  }

  // 外層網址的 ?page= 原樣帶進內層（app.html?page=leave → 內層開請假）
  function outerPage(){
    try { return new URLSearchParams(location.search).get('page') || 'punch'; }
    catch(e){ return 'punch'; }
  }

  var watchdog = null;
  function load(page){
    page = page || outerPage();
    veil.classList.remove('hide');
    go.classList.remove('on');
    spin.style.display = '';
    msg.textContent = '連線中…';
    sub.textContent = '';
    clearTimeout(watchdog);
    watchdog = setTimeout(function(){
      fail('連線逾時', '網路慢或系統忙碌，<br>可以再試一次。', '重新載入', 'javascript:location.reload()');
    }, 20000);

    var tok = getCk('WZ_TOKEN_CK');
    if (!tok){
      clearTimeout(watchdog);
      fail('尚未登入', '請先從首頁登入一次，<br>之後這裡就會自動進入。', '前往登入', 'index.html');
      return;
    }

    // ★ 每次載入都跟後端要一張新鮮的接力碼（rc 只活 60 秒，不能重用）
    fetch(EXEC + '?page=validate&t=' + encodeURIComponent(tok) + '&fresh=1')
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok){
          clearTimeout(watchdog);
          fail('登入已失效', '請重新登入一次。', '前往登入', 'index.html');
          return;
        }
        var u = EXEC + '?page=' + encodeURIComponent(page);
        if (d.rc) u += '&rc=' + encodeURIComponent(d.rc);
        frame.src = u;
      })
      .catch(function(){
        clearTimeout(watchdog);
        fail('連線失敗', '請確認網路後再試一次。', '重新載入', 'javascript:location.reload()');
      });
  }

  frame.addEventListener('load', function(){
    if (!frame.src || frame.src === 'about:blank') return;   // about:blank 也會觸發，要擋掉
    clearTimeout(watchdog);
    setTimeout(function(){ veil.classList.add('hide'); }, 350);
  });

  // ── 內層喊話（等 GAS 端改成 postMessage 之後才會用到）──────────
  window.addEventListener('message', function(ev){
    var o = ev.origin || '';
    if (!/\.googleusercontent\.com$/.test(o) && o !== 'https://script.google.com') return;
    var d = ev.data; if (!d) return;
    if (d.t === 'wznav'){                                  // 換頁：外殼重新載入 iframe
      var p = String(d.page || 'punch');
      try { history.replaceState(null, '', '?page=' + encodeURIComponent(p)); } catch(e){}
      load(p);
      return;
    }
    if (d.t === 'wzurl'){                                  // 只換網址不重載
      var q = String(d.page || '');
      try { history.replaceState(null, '', q ? ('?page=' + encodeURIComponent(q)) : location.pathname); } catch(e){}
      return;
    }
    if (d.t === 'wzlogout'){
      frame.src = 'about:blank';
      location.replace('index.html?logout=1');
      return;
    }
  });

  load();
})();
</script>
</body>
</html>
